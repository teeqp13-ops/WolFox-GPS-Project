name: Validate WolFox GPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          php -l backend/config.php
          php -l backend/api.php
          php -l backend/api/activate.php
          php -l backend/admin/assistant.php
      - name: Validate project manifests
        run: |
          test -f theos/Makefile
          test -f theos/control
          test -f theos/Tweak.xm
          test -f theos/WFActivation.mm
      - name: Prevent committed runtime secrets
        run: |
          ! grep -RInE "define\('ADMIN_PASSWORD',[[:space:]]*'[^']+'|HMAC_SECRET[[:space:]]*@" backend theos
      - name: Explain build boundary
        run: |
          echo "Theos packaging is intentionally performed only in a compatible macOS/Theos environment."
