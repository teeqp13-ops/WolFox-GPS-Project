name: Build HoGo Dylib

on:
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً بضغطة زر

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "~/theos/bin" >> $GITHUB_PATH

      - name: Build Dylib
        run: |
          # إنشاء ملفات المشروع تلقائياً
          echo "include \$(THEOS)/makefiles/common.make
          TWEAK_NAME = HoGo_License
          HoGo_License_FILES = HoGo_License_Bypass.m
          HoGo_License_CFLAGS = -fobjc-arc
          include \$(THEOS_MAKE_PATH)/tweak.make" > Makefile
          
          echo "Package: com.hogo.license
          Name: HoGo License Bypass
          Depends: mobilesubstrate
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: HoGo License System for iOS
          Maintainer: HoGo" > control
          
          make package FINALPACKAGE=1

      - name: Upload Result
        uses: actions/upload-artifact@v3
        with:
          name: HoGo_Dylib
          path: packages/*.deb
